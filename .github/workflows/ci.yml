name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.2

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        env:
          GOWORK: off
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage check
        run: |
          go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//' | { read cov; if [ "$(echo "$cov < 95" | bc)" -eq 1 ]; then echo "Coverage $cov% is below 95%"; exit 1; fi; echo "Coverage: $cov%"; }
      - name: Tidy check
        run: |
          go mod tidy
          go mod tidy -diff
          test -z "$(git status --porcelain go.mod go.sum)" || { echo "go.mod or go.sum is dirty after tidy"; exit 1; }

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Fuzz
        run: go test -fuzz=. -fuzztime=30s ./...

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golang/govulncheck-action@v1
